# App name must be globally unique across all of Fly — rename this if
# "on-deck" is already taken before running `fly launch`/`fly apps create`.
app = "on-deck"
primary_region = "iad"

[build]

# Migrations run here, not from the app's own start command.
#
# Fly runs this once, in a throwaway machine, before the new release reaches
# any app machine — so exactly one process migrates, and a failure aborts the
# deploy with the old version still serving. Chaining it into `npm start`
# instead meant every machine migrated on every boot (there is more than one;
# see db/migrations/20260802020000_recommendation_jobs), they raced with no
# lock between them, and a bad migration crash-looped the machine rather than
# failing the deploy.
#
# Because this runs *before* the new code is live, and because a rolling
# deploy overlaps old and new code anyway, every migration has to be
# compatible with the version already running. Anything that isn't needs a
# maintenance window or an expand/contract sequence.
[deploy]
  release_command = "npm run db:migrate"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 lets the machine scale to zero when idle (cheaper for a personal-scale
  # app) at the cost of a cold start on the next request. Set to 1 to keep it
  # always warm.
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
